[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
requires-python = ">=3.11"
name = "reactors_czlab"
version = "2025.0.0"
description = "Bioreactor control module"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Alexis Saldivar", email = "asaldivarg93@gmail.com" },
    { name = "Bhavana Palapati", email = "bpalapati0099@sdsu.edu" },
]

dependencies = [
    "asyncua==2.0.1",
    "lmfit>=1.3.4,<2",
    "numpy==2.0.0",
    "scipy>=1.12.0",
]

[project.optional-dependencies]
server = [
    "pymodbus==3.15",
    "pyserial==3.5",
    "adafruit-circuitpython-busdevice",
    "adafruit-circuitpython-tca9548a",
    "adafruit-circuitpython-as7341",
    "adafruit-circuitpython-tlc59711",
]
client = [
    "opcua-client==0.8.4",
    "psycopg==3.3.4",
    "ipykernel==7.3.0",
    "polars==1.43.2",
    "matplotlib",
]
gui = [
    "nicegui==3.15.0",
    "plotly==6.9.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "nicegui==3.15.0",
    "plotly==6.9.0",
]

[project.scripts]
reactors-server = "reactors_czlab.run_server:cli"
reactors-client = "reactors_czlab.run_client:cli"
reactors-gui = "reactors_czlab.run_gui:cli"
reactors-plots = "reactors_czlab.run_plots:cli"
reactors-export = "reactors_czlab.export_data:cli"
reactors-db-migrate = "reactors_czlab.run_migrate:cli"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# nicegui.testing.user_plugin only - NOT nicegui.testing.plugin, which
# also pulls in the Selenium-backed `screen` fixture and would make the
# suite depend on a browser and a webdriver.
addopts = "-p nicegui.testing.user_plugin"
# The module NiceGUI reloads to find the pages under test.
main_file = "tests/gui_main.py"

[tool.ruff]
line-length = 150
target-version = "py311"
